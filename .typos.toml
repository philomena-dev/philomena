[default]
extend-ignore-re = [
  # Ignore development secret key. Production secret key should
  # be in environment files and not checked into source control.
  ".*secret_key_base.*",

  # Key constraints with encoded names
  "fk_rails_[a-f0-9]+",

  # Database dumps
  "\\\\restrict.*",
  "\\\\unrestrict.*",

  # Ignore lines that end with `# spellchecker:disable-line`
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",

  # Ignore the line after `# spellchecker:ignore-next-line`:
  "(#|//)\\s*spellchecker:ignore-next-line\\n.*",

  # Ignore blocks between `# spellchecker:off` and `# spellchecker:on`
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
]

[default.extend-words]
# Template class names
togglable = "togglable"
